zerops:
  - setup: backend
    build:
      base: nodejs@20
      buildCommands:
        - cd backend && npm install
      deployFiles:
        - backend
    run:
      base: nodejs@20
      workingDir: backend
      start: npm start
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        GEMINI_API_KEY: ${GEMINI_API_KEY}
        DATABASE_URL: ${DATABASE_URL}
        RESEND_API_KEY: ${RESEND_API_KEY}
        REMINDER_EMAIL: ${REMINDER_EMAIL}